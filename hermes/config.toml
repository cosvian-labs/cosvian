# Hermes relayer configuration (Bitora ↔ Osmosis Testnet + placeholder Mainnet)
# Generated: 2025-09-08

[global]
log_level = 'info'

[mode]
[mode.clients]
enabled = true
refresh = true
misbehaviour = true

[mode.connections]
enabled = true

[mode.channels]
enabled = false

[mode.packets]
enabled = true
clear_interval = 0
clear_on_start = false
tx_confirmation = false

[rest]
enabled = false
host = '127.0.0.1'
port = 3031

[telemetry]
enabled = false
host = '127.0.0.1'
port = 3001

#################################################################
# Chain: Bitora (local dev)                                     #
#################################################################
[[chains]]
id = 'bitora'
type = 'CosmosSdk'
account_prefix = 'bto'
key_name = 'pool_ecosystem'
store_prefix = 'ibc'
address_type = { derivation = 'cosmos' }
clock_drift = '30s'
max_block_time = '10s'
max_gas = 3_000_000
gas_price = { price = 0.025, denom = 'ubto' }

rpc_addr = 'http://localhost:26657'
grpc_addr = 'http://localhost:9090'
event_source = { mode = 'push', url = 'ws://localhost:26657/websocket', batch_delay = '200ms' }

rpc_timeout = '15s'
trusted_node = false

# Restrict packet relaying on Bitora to ICQ channel on connection-0
[chains.packet_filter]
policy = 'allow'
list = [[ 'icqcontroller', 'channel-4' ]]

 # (packet filter removed – default allow)

#################################################################
# Chain: Osmosis Testnet (osmo-test-5)
#################################################################
[[chains]]
id = 'osmo-test-5'
type = 'CosmosSdk'
account_prefix = 'osmo'
key_name = 'osmo-test-relayer'
store_prefix = 'ibc'
address_type = { derivation = 'cosmos' }
clock_drift = '45s'
max_block_time = '10s'
max_gas = 3_000_000
gas_price = { price = 0.01, denom = 'uosmo' }

rpc_addr = 'https://rpc.osmotest5.osmosis.zone:443'
grpc_addr = 'https://grpc.osmotest5.osmosis.zone:443'
event_source = { mode = 'push', url = 'wss://rpc.osmotest5.osmosis.zone/websocket', batch_delay = '400ms' }

rpc_timeout = '20s'
trusted_node = false

#################################################################
# (Optional) Osmosis Mainnet placeholder - disabled until needed
#################################################################
[[chains]]
id = 'osmosis-1'
type = 'CosmosSdk'
account_prefix = 'osmo'
key_name = 'osmo-main-relayer'
store_prefix = 'ibc'
address_type = { derivation = 'cosmos' }
clock_drift = '45s'
max_block_time = '10s'
max_gas = 3_000_000
gas_price = { price = 0.025, denom = 'uosmo' }
rpc_addr = 'https://rpc.osmosis.zone:443'
grpc_addr = 'https://grpc.osmosis.zone:443'
event_source = { mode = 'push', url = 'wss://rpc.osmosis.zone/websocket', batch_delay = '400ms' }
rpc_timeout = '20s'
trusted_node = false


