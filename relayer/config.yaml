global:
  api-listen-addr: :5183
  timeout: 10s
  memo: ""
  light-cache-size: 20
chains:
  bitora:
    type: cosmos
    value:
      key-directory: /home/munra/.relayer/keys/bitora
      key: default
      chain-id: bitora-1
      rpc-addr: http://localhost:26657
      grpc-addr: localhost:9090
      account-prefix: bto
      keyring-backend: test
      gas-adjustment: 1.2
      gas-prices: 0.025ubto
      min-gas-amount: 1000
      debug: false
      timeout: 20s
      block-timeout: ""
      output-format: json
      sign-mode: direct
      extra-codecs: []
      coin-type: 118
      signing-algorithm: ""
      broadcast-mode: batch
      min-loop-duration: 0s
      extension-options: []

  bandchain:
    type: cosmos
    value:
      key-directory: /home/munra/.relayer/keys/bandchain
      key: relayer-bandchain
      chain-id: laozi-mainnet
      rpc-addr: https://band-rpc.noders.services
      grpc-addr: band-grpc.noders.services:30090
      account-prefix: band
      keyring-backend: test
      gas-adjustment: 1.2
      gas-prices: 0.0025uband
      min-gas-amount: 1000
      debug: false
      timeout: 20s
      block-timeout: ""
      output-format: json
      sign-mode: direct
      extra-codecs: []
      coin-type: 494
      signing-algorithm: ""
      broadcast-mode: batch
      min-loop-duration: 0s
      extension-options: []

paths:
  oracle_path:
    src:
      chain-id: bitora-1
      client-id: 07-tendermint-0
      connection-id: connection-0
    dst:
      chain-id: band-testnet
      client-id: 07-tendermint-0
      connection-id: connection-0
    src-channel-filter:
      rule: allowlist
      channel-list: []
