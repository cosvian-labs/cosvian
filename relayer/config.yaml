global:
  api-listen-addr: :5183
  timeout: 10s
  memo: ""
  light-cache-size: 20
chains:
  cosvian:
    type: cosmos
    value:
      key-directory: /home/munra/.relayer/keys/cosvian
      key: default
      chain-id: cosvian
      rpc-addr: http://localhost:26657
      grpc-addr: localhost:9090
      account-prefix: csv
      keyring-backend: test
      gas-adjustment: 1.2
      gas-prices: 0.025ucsv
      min-gas-amount: 1000
      debug: false
      timeout: 20s
      block-timeout: ""
      output-format: json
      sign-mode: direct
      extra-codecs: []
      coin-type: 118
      signing-algorithm: ""
      broadcast-mode: batch
      min-loop-duration: 0s
      extension-options: []

  bandchain:
    type: cosmos
    value:
      key-directory: /home/munra/.relayer/keys/bandchain
      key: relayer-bandchain
      chain-id: laozi-mainnet
      rpc-addr: https://band-rpc.noders.services
      grpc-addr: band-grpc.noders.services:30090
      account-prefix: band
      keyring-backend: test
      gas-adjustment: 1.2
      gas-prices: 0.0025uband
      min-gas-amount: 1000
      debug: false
      timeout: 20s
      block-timeout: ""
      output-format: json
      sign-mode: direct
      extra-codecs: []
      coin-type: 494
      signing-algorithm: ""
      broadcast-mode: batch
      min-loop-duration: 0s
      extension-options: []

  band-laozi-testnet6:
    type: cosmos
    value:
      key-directory: /home/munra/.relayer/keys/band-testnet6
      key: default
      chain-id: band-laozi-testnet6
      rpc-addr: https://rpc.laozi-testnet6.bandchain.org:443
      grpc-addr: https://grpc.laozi-testnet6.bandchain.org:443
      account-prefix: band
      keyring-backend: test
      gas-adjustment: 1.2
      gas-prices: 0.01uband
      min-gas-amount: 1
      debug: true
      timeout: 30s
      block-timeout: ""
      output-format: json
      sign-mode: direct
      extra-codecs: []
      coin-type: 494
      signing-algorithm: ""
      broadcast-mode: batch
      min-loop-duration: 0s
      extension-options: []

  band-v3-testnet:
    type: cosmos
    value:
      key-directory: /home/munra/.relayer/keys/band-v3-testnet
      key: default
      chain-id: band-v3-testnet-1
      rpc-addr: https://band-testnet-rpc.polkachu.com:443
      grpc-addr: https://band-testnet-rpc.polkachu.com:9090
      account-prefix: band
      keyring-backend: test
      gas-adjustment: 1.2
      gas-prices: 0.0025uband
      min-gas-amount: 1000
      debug: false
      timeout: 30s
      block-timeout: ""
      output-format: json
      sign-mode: direct
      extra-codecs: []
      coin-type: 494
      signing-algorithm: ""
      broadcast-mode: batch
      min-loop-duration: 0s
      extension-options: []

paths:
  oracle_path_mainnet:
    src:
      chain-id: cosvian
      client-id: ""
      connection-id: ""
    dst:
      chain-id: laozi-mainnet
      client-id: ""
      connection-id: ""
    src-channel-filter:
      rule: allowlist
      channel-list: []

  oracle_path_testnet6:
    src:
      chain-id: cosvian
      client-id: ""
      connection-id: ""
    dst:
      chain-id: band-laozi-testnet6
      client-id: ""
      connection-id: ""
    src-channel-filter:
      rule: allowlist
      channel-list: []

  oracle_path_v3:
    src:
      chain-id: cosvian
      client-id: ""
      connection-id: ""
    dst:
      chain-id: band-v3-testnet-1
      client-id: ""
      connection-id: ""
    src-channel-filter:
      rule: allowlist
      channel-list: []

