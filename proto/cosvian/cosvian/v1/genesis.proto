syntax = "proto3";
package cosvian.cosvian.v1;

import "amino/amino.proto";
import "cosvian/cosvian/v1/params.proto";
import "gogoproto/gogo.proto";

option go_package = "cosvian/x/cosvian/types";

// GenesisState defines the cosvian module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}
