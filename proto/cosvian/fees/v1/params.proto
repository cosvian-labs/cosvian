syntax = "proto3";
package cosvian.fees.v1;

import "amino/amino.proto";
import "cosvian/fees/v1/fee_config.proto";
import "cosvian/fees/v1/guard_rails.proto";
import "cosvian/fees/v1/oracle_params.proto";
import "gogoproto/gogo.proto";

option go_package = "cosvian/x/fees/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "cosvian/x/fees/Params";
  option (gogoproto.equal) = true;

  FeeTableUSD fee_table_usd = 1 [(gogoproto.nullable) = false];
  OracleParams oracle_params = 2 [(gogoproto.nullable) = false];
  GuardRails guard_rails = 3 [(gogoproto.nullable) = false];
  MinGasPolicy min_gas_policy = 4 [(gogoproto.nullable) = false];

  // Wallet addresses for fee distribution
  string treasury_wallet = 5;
  string retail_wallet = 6;
  string token_dev_wallet = 7;
  string token_creator_wallet = 8;

  // Fee mode controls how USD table is applied:
  // "table" (default) = always charge according to USD table
  // "hybrid" = charge USD table only if at least one user/economic msg present. Pure system IBC / governance maintenance txs pay gas only.
  // "gas_only" = ignore USD table entirely (emergency fallback)
  string fee_mode = 9;

  // Explicit system message type URLs. If ALL msgs in a tx are within this set (after deep-unwrapping Authz / ICA),
  // then in hybrid mode the tx is treated as system-only (USD component waived; gas still required).
  repeated string system_msg_type_urls = 10;

  // Additional exempt message type URLs (e.g., future maintenance ops) that should also be zero-USD in hybrid mode when tx is homogeneous.
  repeated string exempt_msg_type_urls = 11;

  // Addresses that are exempt (e.g., designated relayer module accounts) when submitting homogeneous system txs in hybrid mode.
  repeated string exempt_addresses = 12;
}

// FeeTableUSD defines USD fee amounts and distribution splits for each category
message FeeTableUSD {
  option (gogoproto.equal) = true;
  FeeConfig pos_payment = 1 [(gogoproto.nullable) = false];
  FeeConfig token_interaction = 2 [(gogoproto.nullable) = false];
  FeeConfig native_transfer = 3 [(gogoproto.nullable) = false];
  FeeConfig dex_native = 4 [(gogoproto.nullable) = false];
  FeeConfig dex_user = 5 [(gogoproto.nullable) = false];
  FeeConfig deploy = 6 [(gogoproto.nullable) = false];
  FeeConfig wizard = 7 [(gogoproto.nullable) = false];
}

// MinGasPolicy defines minimum gas price policy
message MinGasPolicy {
  option (gogoproto.equal) = true;
  bool enabled = 1;
  string global_min_gas_price = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  bool allow_per_tx_override = 3;
}
