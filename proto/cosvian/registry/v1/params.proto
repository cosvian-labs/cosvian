syntax = "proto3";
package cosvian.registry.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "cosvian/x/registry/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "cosvian/x/registry/Params";
  option (gogoproto.equal) = true;

  string pos_compatible_tokens = 1;
  string wallet_compatible_tokens = 2;
  string min_token_standard = 3;
}
