syntax = "proto3";
package cosvian.token.v1;

import "amino/amino.proto";
import "cosvian/token/v1/params.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";

option go_package = "cosvian/x/token/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/cosvian/token/v1/params";
  }
  // Token metadata queries
  rpc TokenById(QueryTokenByIdRequest) returns (QueryTokenByIdResponse) {
    option (google.api.http).get = "/cosvian/token/v1/token/{token_id}";
  }
  rpc TokenBySymbol(QueryTokenBySymbolRequest) returns (QueryTokenBySymbolResponse) {
    option (google.api.http).get = "/cosvian/token/v1/symbol/{symbol}";
  }
  rpc TokensByCreator(QueryTokensByCreatorRequest) returns (QueryTokensByCreatorResponse) {
    option (google.api.http).get = "/cosvian/token/v1/creator/{creator}";
  }
  rpc AllTokens(QueryAllTokensRequest) returns (QueryAllTokensResponse) {
    option (google.api.http).get = "/cosvian/token/v1/tokens";
  }
  // Supply & balance queries
  rpc TokenSupply(QueryTokenSupplyRequest) returns (QueryTokenSupplyResponse) {
    option (google.api.http).get = "/cosvian/token/v1/supply/{denom}";
  }
  rpc TokenBalance(QueryTokenBalanceRequest) returns (QueryTokenBalanceResponse) {
    option (google.api.http).get = "/cosvian/token/v1/balance/{address}/{denom}";
  }
}

// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// Token metadata single lookup
message QueryTokenByIdRequest {
  string token_id = 1;
}
message QueryTokenByIdResponse {
  string token_id = 1;
  string name = 2;
  string symbol = 3;
  uint32 decimals = 4;
  string max_supply = 5;
  string current_supply = 6;
  bool mintable = 7;
  bool pos_compatible = 8;
  string creator = 9;
  string icon_uri = 10;
  string description = 11;
  string denom = 12; // u{symbol}
  string created_at = 13; // RFC3339
}

message QueryTokenBySymbolRequest {
  string symbol = 1;
}
message QueryTokenBySymbolResponse {
  string token_id = 1;
  string name = 2;
  string symbol = 3;
  uint32 decimals = 4;
  string max_supply = 5;
  string current_supply = 6;
  bool mintable = 7;
  bool pos_compatible = 8;
  string creator = 9;
  string icon_uri = 10;
  string description = 11;
  string denom = 12;
  string created_at = 13;
}

// Listing by creator
message QueryTokensByCreatorRequest {
  string creator = 1; // bech32
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}
message QueryTokensByCreatorResponse {
  repeated QueryTokenByIdResponse tokens = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// All tokens
message QueryAllTokensRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}
message QueryAllTokensResponse {
  repeated QueryTokenByIdResponse tokens = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// Supply query
message QueryTokenSupplyRequest {
  string denom = 1;
}
message QueryTokenSupplyResponse {
  string denom = 1;
  string amount = 2;
}

// Balance query
message QueryTokenBalanceRequest {
  string address = 1;
  string denom = 2;
}
message QueryTokenBalanceResponse {
  string address = 1;
  string denom = 2;
  string balance = 3;
}
