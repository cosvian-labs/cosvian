syntax = "proto3";
package bitora.conversionpool.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "bitora/x/conversionpool/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "bitora/x/conversionpool/Params";
  option (gogoproto.equal) = true;

  string max_conversion_supply = 1;
  string conversion_rate = 2;
  string min_pool_reserve = 3;
}
