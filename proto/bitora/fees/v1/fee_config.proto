syntax = "proto3";
package bitora.fees.v1;

import "gogoproto/gogo.proto";

option go_package = "bitora/x/fees/types";

// FeeConfig defines fee amount and distribution split
message FeeConfig {
  string usd_amount = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  FeeSplit split = 2 [(gogoproto.nullable) = false];
}

// FeeSplit defines how fees are distributed (percentages must sum to 100)
message FeeSplit {
  string treasury = 1 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string retail_wallet = 2 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string token_dev = 3 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
  string token_creator = 4 [
    (gogoproto.customtype) = "cosmossdk.io/math.LegacyDec",
    (gogoproto.nullable) = false
  ];
}
