syntax = "proto3";
package bitora.icqcontroller.v1;

option go_package = "bitora/x/icqcontroller/types";

// IcqcontrollerPacketData defines the Icqcontroller data packet.
message IcqcontrollerPacketData {
  oneof packet {
    NoData noData = 1;
  }
}

// NoData defines an empty data packet.
message NoData {}
