syntax = "proto3";
package bitora.bitora.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "bitora/x/bitora/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "bitora/x/bitora/Params";
  option (gogoproto.equal) = true;
}
