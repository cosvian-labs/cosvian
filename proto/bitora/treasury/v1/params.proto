syntax = "proto3";
package bitora.treasury.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "bitora/x/treasury/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "bitora/x/treasury/Params";
  option (gogoproto.equal) = true;

  string distribution_ratio = 1;
  string validator_reward_percentage = 2;
  string dev_reward_percentage = 3;
}
